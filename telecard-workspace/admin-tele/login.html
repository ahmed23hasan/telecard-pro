<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELE CARD | تسجيل دخول الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .spinner { display: none; margin-left: 10px; animation: fa-spin 1s infinite linear; }
        .btn-loading .spinner { display: inline-block; }
        .btn-loading #btn-text { opacity: 0.7; }
        .btn-loading #btn-icon { display: none; }
    </style>
</head>
<body>
    
    <script>
        if (localStorage.getItem('telecard_theme') === 'light') {
            document.body.classList.add('light-mode');
        }
    </script>

    <div class="auth-overlay active">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2>تسجيل الدخول للإدارة</h2>
                <p>يرجى إدخال بيانات الاعتماد للوصول للوحة القيادة</p>
            </div>
            
            <form id="admin-login-form">
                <div class="auth-input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="auth-email" placeholder="البريد الإلكتروني" required>
                </div>
                <div class="auth-input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="auth-password" placeholder="كلمة المرور" required>
                </div>
                
                <div id="auth-error" class="auth-error-msg hide-element">بيانات الدخول غير صحيحة!</div>
                
                <button type="submit" class="btn btn-primary auth-submit-btn" id="btn-login">
                    <i class="fa-solid fa-circle-notch spinner"></i>
                    <span id="btn-text">دخول آمن</span>
                    <i id="btn-icon" class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { DB_KEYS } from './adminConfig.js';
        import { FirebaseAdapter } from './core/firebaseAdapter.js';

        const loginForm = document.getElementById('admin-login-form');
        const emailInput = document.getElementById('auth-email');
        const passInput = document.getElementById('auth-password');
        const errorMsg = document.getElementById('auth-error');
        const btnLogin = document.getElementById('btn-login');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            errorMsg.classList.add('hide-element');
            btnLogin.classList.add('btn-loading');
            btnLogin.disabled = true;

            try {
                const adminProfile = await FirebaseAdapter.getById(DB_KEYS.ADMIN, 'singleton');

                let validEmail = 'admin@telecard.pro';
                let validPass = '123';

                if (adminProfile) {
                    validEmail = adminProfile.email || validEmail;
                    validPass = adminProfile.pass || validPass;
                }

                const inputEmail = emailInput.value.trim().toLowerCase();
                const inputPass = passInput.value;

                if (inputEmail === validEmail.toLowerCase() && inputPass === validPass) {
                    sessionStorage.setItem('telecard_admin_auth', 'true');
                    
                    btnLogin.style.background = "#10b981";
                    document.getElementById('btn-text').innerText = "تم التحقق.. جاري الدخول";
                    
                    setTimeout(() => {
                        window.location.replace('admin.html');
                    }, 800);
                    
                } else {
                    throw new Error('Wrong Credentials');
                }

            } catch (error) {
                console.error("Login Error:", error.message || error);
                
                errorMsg.innerText = error.message === 'Wrong Credentials' ? 'البريد الإلكتروني أو كلمة المرور غير صحيحة!' : 'تعذر الاتصال بقاعدة البيانات، يرجى المحاولة لاحقاً.';
                errorMsg.classList.remove('hide-element');
                btnLogin.classList.remove('btn-loading');
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
