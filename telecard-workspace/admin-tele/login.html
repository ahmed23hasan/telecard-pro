<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TELE CARD | تسجيل دخول الإدارة</title>
    
    <!-- 🛡️ حارس البوابة السريع: فحص الجلسة قبل تحميل أي ملف -->
    <script>
    (function() {
        const isAuth = localStorage.getItem('telecard_admin_auth') === 'true';
        const lastAct = parseInt(localStorage.getItem('telecard_admin_last_activity') || '0', 10);
        const IDLE_LIMIT = 10 * 60 * 1000;
        if (isAuth && lastAct > 0 && (Date.now() - lastAct <= IDLE_LIMIT)) {
            window.location.replace('admin.html');
        } else if (isAuth) {
            localStorage.removeItem('telecard_admin_auth');
            localStorage.removeItem('telecard_admin_last_activity');
        }
    })();
    </script>

    <!-- 🚀 استدعاء خط Cairo و Inter معاً لمنع تشوه الأرقام والرموز -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    
    <script>
        // حفظ الوضع الليلي/النهاري بسرعة قبل رسم الشاشة
        if (localStorage.getItem('telecard_theme') === 'light') {
            document.body.classList.add('light-mode');
        }
    </script>

    <!-- النافذة الرئيسية لتسجيل الدخول -->
    <div class="auth-overlay active">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2>تسجيل الدخول للإدارة</h2>
                <p>يرجى إدخال بيانات الاعتماد للوصول للوحة القيادة</p>
            </div>
            
            <form id="admin-login-form" autocomplete="off">
                <div class="auth-input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="auth-email" class="input-en" placeholder="البريد الإلكتروني" autocomplete="username" required>
                </div>
                <div class="auth-input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="auth-password" class="input-en" placeholder="كلمة المرور" autocomplete="current-password" required>
                </div>
                
                <div id="auth-error" class="auth-error-msg hide-element">بيانات الدخول غير صحيحة!</div>
                
                <button type="submit" class="btn btn-primary auth-submit-btn interactive-scale" id="btn-login">
                    <i id="btn-icon" class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span id="btn-text">دخول آمن</span>
                    <i class="fa-solid fa-circle-notch spinner"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- 🌟 نافذة إدخال كود المصادقة الثنائية (2FA) -->
    <div class="auth-overlay" id="admin-2fa-modal">
        <div class="auth-card mfa-card">
            <div class="auth-header">
                <div class="auth-logo mfa-logo">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2>مصادقة أمنية (2FA)</h2>
                <p>حساب الإدارة محمي. أدخل الرمز المكون من 6 أرقام.</p>
            </div>
            <div class="auth-input-group mfa-input-group">
                <i class="fa-solid fa-key text-success"></i>
                <input type="text" id="admin-2fa-code" class="mfa-code-input font-numeric" placeholder="000 000" maxlength="6" inputmode="numeric" dir="ltr" lang="en">
            </div>
            <div id="admin-2fa-error" class="auth-error-msg hide-element">الرمز غير صحيح!</div>
            <div class="mfa-actions">
                <button type="button" class="btn btn-primary auth-submit-btn mfa-submit-btn interactive-scale" id="btn-verify-2fa">تحقق ودخول</button>
                <button type="button" class="btn btn-ghost mfa-cancel-btn interactive-scale" id="btn-cancel-2fa">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module" src="auth.js"></script>

</body>
</html>
