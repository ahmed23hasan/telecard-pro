<!-- 🛠️ واجهة الوظائف النقية (Pure UI Logic) -->
<script>
    function showCustomAlert(title, message, type = 'error') {
        const overlay = document.getElementById('customAlert');
        const card = document.getElementById('alertCard');
        const titleEl = document.getElementById('alertTitle');
        const msgEl = document.getElementById('alertMsg');
        const iconBox = document.getElementById('alertIconBox');
        const btn = document.getElementById('alertOkBtn');
        if (!overlay || !titleEl || !msgEl) return;
        
        titleEl.textContent = title; msgEl.textContent = message;
        card.className = "sys-dialog-card"; iconBox.className = "sys-dialog-icon"; titleEl.className = "sys-dialog-title"; btn.style.display = 'block';

        if (type === 'info') {
            iconBox.style.cssText = "color:#0ea5e9; border-color:#0ea5e9; background:rgba(14, 165, 233, 0.15)";
            titleEl.style.color = "#0ea5e9"; iconBox.innerHTML = `<i class="fa-solid fa-user-check" style="font-size: 24px;"></i>`; card.style.borderColor = "#0ea5e9"; btn.style.display = 'none'; 
        } else if (type === 'success') {
            iconBox.style.cssText = "color:var(--success); border-color:var(--success); background:var(--success-bg)";
            titleEl.style.color = "var(--success)"; card.style.borderColor = "var(--success)";
            iconBox.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
        } else {
            iconBox.className = "sys-dialog-icon danger"; titleEl.className = "sys-dialog-title danger"; card.classList.add('danger-border');
            iconBox.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
        }
        overlay.classList.add('active'); document.body.style.overflow = 'hidden'; 
    }

    function closeCustomAlert() {
        const overlay = document.getElementById('customAlert');
        if (overlay) { overlay.classList.remove('active'); document.body.style.overflow = ''; }
    }

    function showError(inputId, errorId, msg) {
        const input = document.getElementById(inputId); const error = document.getElementById(errorId);
        if(!input || !error) return;
        input.classList.remove('shake-error-input'); void input.offsetWidth; 
        input.classList.add('input-error', 'shake-error-input');
        if(msg) error.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${msg}`;
        error.style.display = 'flex';
    }

    function hideError(inputId, errorId) {
        const input = document.getElementById(inputId); const error = document.getElementById(errorId);
        if (input) input.classList.remove('input-error', 'shake-error-input');
        if (error) error.style.display = 'none';
    }

    // 🛡️ ربط أحداث الواجهة بأمان بعد اكتمال الـ DOM
    document.addEventListener('DOMContentLoaded', () => {
        const fields = [
            { id: 'identifier', err: 'identifierError' }, 
            { id: 'password', err: 'passwordError' }, 
            { id: 'forgotEmailInput', err: 'forgotEmailError' }, 
            { id: 'loginOtpInput', err: 'loginOtpError' }
        ];
        fields.forEach(field => {
            const el = document.getElementById(field.id);
            if (el) el.addEventListener('input', () => hideError(field.id, field.err));
        });

        const toggleEye = document.getElementById('togglePassEye');
        if (toggleEye) {
            toggleEye.addEventListener('click', function() {
                const inp = document.getElementById('password');
                if(!inp) return;
                const toText = inp.type === "password";
                inp.type = toText ? "text" : "password";
                toText ? this.classList.add('active') : this.classList.remove('active');
                inp.focus();
            });
        }

        const alertOkBtn = document.getElementById('alertOkBtn');
        if (alertOkBtn) alertOkBtn.addEventListener('click', closeCustomAlert);

        // فتح نافذة نسيت كلمة المرور
        const forgotLink = document.getElementById('forgotPassLink');
        if (forgotLink) {
            forgotLink.addEventListener('click', (e) => {
                e.preventDefault();
                const mainEmailInput = document.getElementById('identifier');
                const forgotEmailInput = document.getElementById('forgotEmailInput');
                const modal = document.getElementById('forgotPasswordModal');
                if (!modal || !forgotEmailInput) return;
                hideError('forgotEmailInput', 'forgotEmailError');
                forgotEmailInput.value = mainEmailInput ? mainEmailInput.value.trim() : "";
                modal.classList.add('active'); document.body.style.overflow = 'hidden';
            });
        }

        // إغلاق نوافذ المودال
        const btnCancelForgot = document.getElementById('btnCancelForgot');
        if (btnCancelForgot) {
            btnCancelForgot.addEventListener('click', () => {
                const modal = document.getElementById('forgotPasswordModal');
                if (modal) { modal.classList.remove('active'); document.body.style.overflow = ''; }
            });
        }

        const btnCancel2FA = document.getElementById('btnCancel2FA');
        if (btnCancel2FA) {
            btnCancel2FA.addEventListener('click', () => {
                // إعلام الـ Module بتفريغ الـ Resolver
                document.dispatchEvent(new Event('cancel2FAEvent'));
                document.getElementById('login2FAModal')?.classList.remove('active');
                document.body.style.overflow = '';
            });
        }

        // التعبئة التلقائية للإيميل إن وجد
        const prefilledEmail = sessionStorage.getItem('prefilled_email');
        if (prefilledEmail) {
            const emailInput = document.getElementById('identifier');
            const passInput = document.getElementById('password');
            if (emailInput) {
                emailInput.value = prefilledEmail;
                setTimeout(() => { if(passInput) passInput.focus(); }, 300);
            }
            sessionStorage.removeItem('prefilled_email');
        }
    });

    // نعرض دالة Show/Hide للـ Module لاستخدامها بأمان
    window.UIBridge = { showCustomAlert, showError, hideError };
</script>

<!-- 🔐 منطق المصادقة الخاص بفايربيز -->
<script type="module">
    import { DB_KEYS, CACHE_KEYS, DYNAMIC_PREFIXES, ACTIVE_USER_KEY } from './config.js';
    import { auth, FirebaseAdapter as StoreDB } from './core/firebaseAdapter.js';
    import { signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail, getMultiFactorResolver, TotpMultiFactorGenerator, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const googleProvider = new GoogleAuthProvider();
    // 🛡️ حماية المتغير بجعله داخلياً فقط في الـ Module لمنع التلاعب (No more window variable)
    let current2FAResolver = null;

    // استقبال حدث الإلغاء لتفريغ المتغير
    document.addEventListener('cancel2FAEvent', () => { current2FAResolver = null; });

    // درع المقاطعة الزمنية
    const withAuthTimeout = (promise, ms = 30000) => {
        let timeoutId;
        const timeoutPromise = new Promise((_, reject) => {
            timeoutId = setTimeout(() => {
                reject(new Error("استغرق الاتصال وقتاً أطول من المعتاد بسبب ضعف الشبكة أو تعليق المتصفح. يرجى المحاولة مجدداً."));
            }, ms);
        });
        return Promise.race([promise, timeoutPromise]).finally(() => clearTimeout(timeoutId));
    };

    const safeWipeSession = async () => {
        await withAuthTimeout(signOut(auth), 5000).catch(()=>{});
        localStorage.removeItem(CACHE_KEYS.ACTIVE_UID);
        localStorage.removeItem(ACTIVE_USER_KEY);
        localStorage.removeItem(CACHE_KEYS.DISPLAY_CURRENCY);
        for (let i = localStorage.length - 1; i >= 0; i--) {
            const key = localStorage.key(i);
            if (key && (key.startsWith('tc_orders_cache_') || key.startsWith('tc_deposits_cache_'))) {
                localStorage.removeItem(key);
            }
        }
    };

    function showButtonSuccess(btn, text) {
        btn.disabled = false; btn.classList.remove('is-loading');
        btn.style.background = "var(--success)"; btn.style.color = "var(--bg-body)"; btn.style.boxShadow = "0 4px 15px rgba(var(--success-rgb), 0.4)";
        btn.querySelector('.btn-content').innerHTML = `${text} <i class="fa-solid fa-check" style="margin-right: 5px;"></i>`;
    }

    async function generateUniqueDisplayId() {
        const timePart = String(Date.now()).slice(-4);
        const randPart = Math.floor(100 + Math.random() * 900);
        return Number(timePart + randPart);
    }

    async function getAdminDefaultCurrency() {
        try {
            if (StoreDB && typeof StoreDB.getById === 'function') {
                const settingsDoc = await StoreDB.getById(DB_KEYS.SETTINGS, 'singleton');
                if (settingsDoc) return String(settingsDoc.defaultCurrency || settingsDoc.currency || 'USD').toUpperCase();
            }
        } catch (error) {}
        return 'USD';
    }

    let preFetchedCurrency = 'USD'; 
    document.addEventListener('DOMContentLoaded', async () => {
        preFetchedCurrency = await getAdminDefaultCurrency();
    });

    async function handleGoogleLogin() {
        const btn = document.getElementById('googleLoginBtn');
        btn.disabled = true; btn.classList.add('is-loading');
        
        try {
            const result = await withAuthTimeout(signInWithPopup(auth, googleProvider));
            const firebaseUser = result.user;
            let activeUserObj = null;
            
            if (StoreDB && typeof StoreDB.getById === 'function') {
                activeUserObj = await StoreDB.getById(DB_KEYS.USERS, firebaseUser.uid);
            }
            
            if (!activeUserObj) {
                const targetCurrency = preFetchedCurrency;
                const shortDisplayId = await generateUniqueDisplayId();
                const rawDisplayName = firebaseUser.displayName || '';
                
                // 🛡️ نفس قوة التنظيف المستخدمة في صفحة التسجيل
                const cleanNameForUser = rawDisplayName.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9\s]/g, "");
                let firstName = ''; let lastName = ''; let finalFullName = '';
                
                if (cleanNameForUser.trim()) {
                    finalFullName = cleanNameForUser.trim();
                    const nameParts = finalFullName.split(' ');
                    firstName = nameParts[0];
                    lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';
                } else {
                    firstName = firebaseUser.email.split('@')[0]; finalFullName = firstName;
                }

                const baseUsername = finalFullName.toLowerCase().replace(/\s+/g, '') + firebaseUser.uid.substring(0, 4);
                let googleAvatar = firebaseUser.photoURL ? firebaseUser.photoURL.replace('=s96-c', '=s400-c') : null;
                
                activeUserObj = {
                    id: firebaseUser.uid, uid: firebaseUser.uid, displayId: shortDisplayId,
                    firstName: firstName, lastName: lastName, fullName: finalFullName, username: baseUsername, email: firebaseUser.email,
                    img: googleAvatar, baseCurrency: targetCurrency, phone: null, country: null, walletBalance: 0, balance: 0, totalSpent: 0, totalDeposit: 0,
                    tierId: "1", tierCycleSpent: 0, tierCycleStartDate: Date.now(), role: 'user', isVerified: false, kycStatus: 'none', isBanned: false, isIpBanned: false, createdAt: Date.now()
                };
                
                if (StoreDB && typeof StoreDB.set === 'function') await StoreDB.set(DB_KEYS.USERS, firebaseUser.uid, activeUserObj);
                sessionStorage.setItem('tc_new_user_signup', 'true');
            } else {
                if (activeUserObj.isBanned || activeUserObj.isIpBanned) {
                    await safeWipeSession();
                    btn.disabled = false; btn.classList.remove('is-loading');
                    window.UIBridge.showCustomAlert("حساب محظور", "عذراً، هذا الحساب محظور من قبل الإدارة.", "error");
                    return;
                }
                if (!activeUserObj.img && firebaseUser.photoURL) {
                    const freshAvatar = firebaseUser.photoURL.replace('=s96-c', '=s400-c');
                    activeUserObj.img = freshAvatar;
                    if (StoreDB && typeof StoreDB.set === 'function') await StoreDB.set(DB_KEYS.USERS, firebaseUser.uid, { img: freshAvatar }, { merge: true });
                }
            }
            
            localStorage.setItem(CACHE_KEYS.ACTIVE_UID, firebaseUser.uid);
            localStorage.setItem(ACTIVE_USER_KEY, JSON.stringify(activeUserObj));
            if (activeUserObj.baseCurrency) localStorage.setItem(CACHE_KEYS.DISPLAY_CURRENCY, activeUserObj.baseCurrency);
            if (activeUserObj.img) localStorage.setItem(DYNAMIC_PREFIXES.USER_IMAGE + firebaseUser.uid, activeUserObj.img);
            
            showButtonSuccess(btn, "تم الدخول بنجاح");
            setTimeout(() => { window.location.replace("./store.html"); }, 1000); 
            
        } catch (error) {
            btn.disabled = false; btn.classList.remove('is-loading');
            if (error.code === 'auth/multi-factor-auth-required') {
                current2FAResolver = getMultiFactorResolver(auth, error);
                document.getElementById('loginOtpInput').value = '';
                document.getElementById('login2FAModal').classList.add('active');
                return;
            }
            if (error.code !== 'auth/popup-closed-by-user') window.UIBridge.showCustomAlert("فشل الدخول", "السبب: " + error.message, "error");
        }
    }

    async function validateLogin() {
        const identifier = document.getElementById('identifier');
        const password = document.getElementById('password');
        let isValid = true;

        if (identifier.value.trim() === "") { window.UIBridge.showError('identifier', 'identifierError', "يرجى إدخال البريد الإلكتروني"); isValid = false; } 
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identifier.value)) { window.UIBridge.showError('identifier', 'identifierError', "البريد الإلكتروني غير صالح"); isValid = false; }
        if (password.value.trim() === "") { window.UIBridge.showError('password', 'passwordError', "يرجى كتابة كلمة المرور"); isValid = false; }
        if (!isValid) return;

        const btn = document.getElementById('loginBtn');
        btn.disabled = true; btn.classList.add('is-loading');

        try {
            const userCredential = await withAuthTimeout(signInWithEmailAndPassword(auth, identifier.value.trim().toLowerCase(), password.value));
            const firebaseUser = userCredential.user;

            let userDoc = null;
            if(StoreDB && typeof StoreDB.getById === 'function') {
                try { userDoc = await StoreDB.getById(DB_KEYS.USERS, firebaseUser.uid); } catch(e) {}
            }

            if (userDoc && (userDoc.isBanned || userDoc.isIpBanned)) {
                await safeWipeSession();
                btn.disabled = false; btn.classList.remove('is-loading');
                window.UIBridge.showCustomAlert("حساب محظور", "عذراً، هذا الحساب محظور من قبل الإدارة.", "error"); return;
            }

            localStorage.setItem(CACHE_KEYS.ACTIVE_UID, firebaseUser.uid);
            if (userDoc) {
                localStorage.setItem(ACTIVE_USER_KEY, JSON.stringify(userDoc));
                if(userDoc.baseCurrency) localStorage.setItem(CACHE_KEYS.DISPLAY_CURRENCY, userDoc.baseCurrency);
                if(userDoc.img) localStorage.setItem(DYNAMIC_PREFIXES.USER_IMAGE + firebaseUser.uid, userDoc.img);
            }

            showButtonSuccess(btn, "تم الدخول بنجاح");
            setTimeout(() => window.location.replace("./store.html"), 1000); 
            
        } catch (error) {
            btn.disabled = false; btn.classList.remove('is-loading');
            if (error.code === 'auth/multi-factor-auth-required') { 
                current2FAResolver = getMultiFactorResolver(auth, error); 
                document.getElementById('loginOtpInput').value = '';
                document.getElementById('login2FAModal').classList.add('active');
                return; 
            }
            if (['auth/invalid-credential', 'auth/user-not-found', 'auth/wrong-password'].includes(error.code)) window.UIBridge.showError('identifier', 'identifierError', "البريد الإلكتروني أو كلمة المرور غير صحيحة");
            else if (error.code === 'auth/too-many-requests') window.UIBridge.showError('identifier', 'identifierError', "تم حظر المحاولات مؤقتاً بسبب تكرار الدخول الخاطئ");
            else window.UIBridge.showError('identifier', 'identifierError', error.message || "حدث خطأ غير متوقع، يرجى المحاولة لاحقاً");
        }
    }

    async function submit2FALogin() {
        if (!current2FAResolver) return;
        const code = document.getElementById('loginOtpInput').value.trim();
        if (code.length !== 6) { window.UIBridge.showError('loginOtpInput', 'loginOtpError', 'يجب إدخال 6 أرقام'); return; }

        const btn = document.getElementById('btnSubmit2FA');
        btn.disabled = true; btn.classList.add('is-loading');

        try {
            const tfaHint = current2FAResolver.hints[0];
            const assertion = TotpMultiFactorGenerator.assertionForSignIn(tfaHint.uid, code);
            const userCredential = await withAuthTimeout(current2FAResolver.resolveSignIn(assertion));
            const firebaseUser = userCredential.user;

            let userDoc = null;
            if(StoreDB && typeof StoreDB.getById === 'function') {
                try { userDoc = await StoreDB.getById(DB_KEYS.USERS, firebaseUser.uid); } catch(e) {}
            }

            if (userDoc && (userDoc.isBanned || userDoc.isIpBanned)) {
                await safeWipeSession();
                btn.disabled = false; btn.classList.remove('is-loading'); 
                document.getElementById('login2FAModal')?.classList.remove('active');
                window.UIBridge.showCustomAlert("حساب محظور", "عذراً، هذا الحساب محظور.", "error"); return;
            }

            localStorage.setItem(CACHE_KEYS.ACTIVE_UID, firebaseUser.uid);
            if (userDoc) {
                localStorage.setItem(ACTIVE_USER_KEY, JSON.stringify(userDoc));
                if(userDoc.baseCurrency) localStorage.setItem(CACHE_KEYS.DISPLAY_CURRENCY, userDoc.baseCurrency);
                if(userDoc.img) localStorage.setItem(DYNAMIC_PREFIXES.USER_IMAGE + firebaseUser.uid, userDoc.img);
            }

            showButtonSuccess(btn, "تم التحقق بنجاح");
            setTimeout(() => window.location.replace("./store.html"), 1000); 

        } catch (error) {
            btn.disabled = false; btn.classList.remove('is-loading');
            window.UIBridge.showError('loginOtpInput', 'loginOtpError', error.message.includes('ضعف الشبكة') ? error.message : 'الكود غير صحيح أو منتهي الصلاحية');
        }
    }

    async function submitForgotPasswordModal() {
        const emailInput = document.getElementById('forgotEmailInput');
        const email = emailInput ? emailInput.value.trim() : "";
        if (email === "") { window.UIBridge.showError('forgotEmailInput', 'forgotEmailError', "يرجى إدخال البريد الإلكتروني"); return; } 
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { window.UIBridge.showError('forgotEmailInput', 'forgotEmailError', "البريد الإلكتروني غير صالح"); return; }
        
        const btn = document.getElementById('btnSubmitForgot');
        btn.disabled = true; btn.classList.add('is-loading');
        
        try {
            await withAuthTimeout(sendPasswordResetEmail(auth, email));
            btn.disabled = false; btn.classList.remove('is-loading');
            document.getElementById('forgotPasswordModal')?.classList.remove('active');
            window.UIBridge.showCustomAlert("تم إرسال الرابط", `إذا كان البريد مسجلاً، فقد أرسلنا رابط الاستعادة. يرجى فحص صندوق الوارد.`, "success");
        } catch (error) {
            btn.disabled = false; btn.classList.remove('is-loading');
            if (error.code === 'auth/user-not-found') { 
                document.getElementById('forgotPasswordModal')?.classList.remove('active');
                window.UIBridge.showCustomAlert("تم إرسال الرابط", `إذا كان البريد مسجلاً، فقد أرسلنا رابط الاستعادة.`, "success"); 
            } 
            else if (error.code === 'auth/too-many-requests') { window.UIBridge.showError('forgotEmailInput', 'forgotEmailError', "تم حظر المحاولات مؤقتاً"); } 
            else { window.UIBridge.showError('forgotEmailInput', 'forgotEmailError', error.message || "تعذر إرسال الإيميل، تحقق من الإنترنت"); }
        }
    }

    // 🛡️ الربط البرمجي الاحترافي (Event Delegation)
    document.addEventListener('DOMContentLoaded', () => {
        const googleBtn = document.getElementById('googleLoginBtn');
        if (googleBtn) googleBtn.addEventListener('click', handleGoogleLogin);

        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                validateLogin();
            });
        }

        const btnSubmitForgot = document.getElementById('btnSubmitForgot');
        if (btnSubmitForgot) btnSubmitForgot.addEventListener('click', submitForgotPasswordModal);

        const btnSubmit2FA = document.getElementById('btnSubmit2FA');
        if (btnSubmit2FA) btnSubmit2FA.addEventListener('click', submit2FALogin);
    });

</script>
