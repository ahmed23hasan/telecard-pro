<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - تيليكارد</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* === تعريف الخطوط === */
        @font-face { font-family: 'Cairo'; src: url('fonts/Cairo-Regular.ttf') format('truetype'); font-weight: 400; }
        @font-face { font-family: 'Cairo'; src: url('fonts/Cairo-Bold.ttf') format('truetype'); font-weight: 700; }
        @font-face { font-family: 'Cairo'; src: url('fonts/Cairo-ExtraBold.ttf') format('truetype'); font-weight: 800; }
        @font-face { font-family: 'Cairo'; src: url('fonts/Cairo-Black.ttf') format('truetype'); font-weight: 900; }

        /* === المتغيرات والألوان === */
        :root {
            --bg-store: #050910; 
            --bg-card: #111a2b;
            --gold-crystal-grad: linear-gradient(135deg, #FFD700 0%, #E3BC43 50%, #FFD700 100%);
            --gold-main: #FFD700;
            --text-btn-luxury: #3d2c00; 
            --error-red: #E53E3E;
            --text-gray: #8F9BB3;
            --border-default: #1F293A;
            --radius: 12px;
        }

        * { box-sizing: border-box; outline: none; font-family: 'Cairo', sans-serif !important; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-store);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px; 
            padding: 40px 30px;
            background-color: var(--bg-card);
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        /* === الرأس === */
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #fff; font-size: 26px; font-weight: 800; margin-bottom: 6px; }
        .glow-gold { color: var(--gold-main); text-shadow: 0 0 8px rgba(251, 191, 36, 0.35); }
        .sub-text { color: var(--text-gray); font-size: 13px; font-weight: 600; }

        /* === زر غوغل === */
        .google-btn {
            width: 100%; height: 50px;
            background: #0a101d; border: 1px solid var(--border-default); border-radius: var(--radius);
            color: #fff; font-size: 14px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer; transition: .3s; margin-bottom: 20px;
        }
        .google-btn:hover { border-color: var(--text-gray); background: #111a2b; transform: translateY(-1px); }

        .divider { display: flex; align-items: center; text-align: center; margin-bottom: 25px; color: var(--text-gray); font-size: 12px; font-weight: 600; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-default); }
        .divider span { padding: 0 15px; }

        /* === الهيكلة المعزولة للحقول === */
        .input-group { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            margin-bottom: 20px;
        }

        .input-box {
            position: relative;
            width: 100%;
            height: 54px;
        }

        .input-field {
            width: 100%; height: 100%; padding: 0 15px;
            background: #0a101d; border: 1px solid var(--border-default);
            border-radius: var(--radius); color: #fff; font-size: 14px; font-weight: 700;
            transition: .3s; appearance: none; position: absolute; top: 0; left: 0; z-index: 2;
        }
        .input-field:focus { border-color: var(--gold-main); box-shadow: 0 0 10px rgba(255, 215, 0, 0.1); }
        .input-error { border-color: var(--error-red) !important; background: rgba(229, 62, 62, 0.05) !important; box-shadow: none !important; }

        /* === التسميات العائمة الذكية === */
        .label {
            position: absolute; 
            top: 50%; right: 15px; transform: translateY(-50%);
            color: var(--text-gray); font-size: 13px; pointer-events: none; transition: .25s; font-weight: 600;
            z-index: 3; background: transparent; padding: 0 4px;
        }
        
        .input-field:focus ~ .label, 
        .input-field:not(:placeholder-shown) ~ .label {
            top: 0; right: 10px; font-size: 11px; font-weight: 700; color: var(--gold-main); background-color: var(--bg-card); z-index: 5;
        }

        /* === وسائد حماية الباسورد وأيقونة العين === */
        input::-ms-reveal, input::-ms-clear { display: none !important; }
        .input-box.has-eye .input-field { padding-left: 45px !important; padding-right: 40px !important; }

        /* === رسائل الخطأ الديناميكية === */
        .error-text { 
            font-size: 11px; color: var(--error-red); font-weight: 700; 
            display: none; line-height: 1.4; margin-top: 6px; padding-right: 5px;
            animation: fadeIn 0.2s ease;
        }

        /* === أيقونة العين === */
        .eye-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-gray); display: flex; align-items: center; justify-content: center; z-index: 10; transition: 0.25s ease; }
        .eye-icon:hover { color: var(--gold-main); }
        .eye-icon svg { width: 22px; height: 22px; }
        .eye-closed { display: block; } .eye-open { display: none; }
        .eye-icon.active .eye-closed { display: none; } .eye-icon.active .eye-open { display: block; }

        /* === خيارات النموذج === */
        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; margin-top: 5px; font-size: 13px; }
        .checkbox-container { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-gray); user-select: none; font-weight: 700; }
        .custom-checkbox { width: 18px; height: 18px; border: 2px solid var(--border-default); border-radius: 5px; background: #0a101d; display: flex; align-items: center; justify-content: center; transition: .3s; }
        input[type="checkbox"]:checked + .custom-checkbox { background: var(--gold-main); border-color: var(--gold-main); }
        input[type="checkbox"] { display: none; }
        .custom-checkbox svg { width: 12px; height: 12px; color: #000; display: none; }
        input[type="checkbox"]:checked + .custom-checkbox svg { display: block; }
        .forgot-link { color: var(--text-gray); text-decoration: none; transition: .3s; font-weight: 700; }
        .forgot-link:hover { color: var(--gold-main); text-shadow: 0 0 5px rgba(251, 191, 36, 0.3); }

        /* === زر الإرسال === */
        .submit-btn {
            width: 100%; height: 54px; 
            background: var(--gold-crystal-grad); color: var(--text-btn-luxury);
            border-radius: var(--radius); font-size: 16px; font-weight: 800;
            cursor: pointer; border: none; transition: transform 0.2s; box-shadow: 0 5px 15px rgba(251, 191, 36, 0.15);
        }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:hover { box-shadow: 0 8px 25px rgba(251, 191, 36, 0.25); }

        .footer-link { text-align: center; margin-top: 25px; font-size: 13px; color: var(--text-gray); font-weight: 700; }
        .footer-link a { color: var(--gold-main); text-decoration: none; font-weight: 800; transition: .3s; }
        .footer-link a:hover { text-shadow: 0 0 6px rgba(255,215,0,0.6); }

        /* === الكلاسات المساعدة === */
        .num-en { font-family: 'Inter', sans-serif !important; direction: ltr !important; text-align: left !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>أهلاً بك في <span class="glow-gold">تيليكارد</span></h1>
            <p class="sub-text">سجل دخولك لمتابعة لوحة التحكم الخاصة بك</p>
        </div>

        <button type="button" class="google-btn" onclick="handleGoogleLogin()">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            تسجيل الدخول بواسطة Google
        </button>

        <div class="divider"><span>أو عبر البريد الإلكتروني</span></div>

        <form autocomplete="off" id="loginForm">

            <div class="input-group">
                <div class="input-box">
                    <input type="email" class="input-field num-en" placeholder=" " id="identifier">
                    <label class="label" style="direction: rtl;">البريد الإلكتروني</label>
                </div>
                <div class="error-text" id="identifierError">يرجى إدخال البريد الإلكتروني</div>
            </div>

            <div class="input-group">
                <div class="input-box has-eye" dir="ltr">
                    <input type="password" class="input-field num-en" placeholder=" " id="password">
                    <label class="label" style="direction: rtl;">كلمة المرور</label>
                    <div class="eye-icon" onclick="togglePass('password', this)">
                        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2.5-4 5.5-6 9-6 3.5 0 6.5 2 9 6-2.5 4-5.5 6-9 6-3.5 0-6.5-2-9-6z" /><path d="M5 5l14 14" stroke-width="1.6" /></svg>
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3.2" /></svg>
                    </div>
                </div>
                <div class="error-text" id="passwordError" style="direction: rtl; text-align: right;">يرجى كتابة كلمة المرور</div>
            </div>

            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" id="rememberMe" checked>
                    <span class="custom-checkbox">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </span>
                    تذكرني
                </label>
                <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
            </div>

            <button type="button" class="submit-btn" id="loginBtn" onclick="validateLogin()">تسجيل الدخول</button>

            <div class="footer-link">
                ليس لديك حساب؟ <a href="signup.html">إنشاء حساب جديد</a>
            </div>

        </form>
    </div>

<script type="module">
    // 🚀 استيراد أدوات فايربيز وقاعدة البيانات من المحول المركزي
    import { auth, db } from './core/firebaseAdapter.js';
    import { signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, query, where, getDocs, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    import { DB_KEYS } from './config.js';
    import { StoreDB } from './dataManager.js';

    const googleProvider = new GoogleAuthProvider();

    // =================================================================
    // 🧠 دالة توليد رقم عرض (Display ID) فريد من 7 خانات (في حال كان العميل جديداً)
    // =================================================================
    async function generateUniqueDisplayId() {
        let isUnique = false;
        let newId = 0;
        let attempts = 0;
        const maxAttempts = 5;

        while (!isUnique && attempts < maxAttempts) {
            attempts++;
            newId = Math.floor(1000000 + Math.random() * 9000000);

            try {
                const q = query(collection(db, DB_KEYS.USERS), where("displayId", "==", newId));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    isUnique = true; 
                }
            } catch (error) {
                console.warn("⚠️ فشل فحص الـ ID، سيتم استخدام خطة الطوارئ.");
                break;
            }
        }

        if (!isUnique) {
            newId = Number(String(Date.now()).slice(-7));
        }

        return newId;
    }

    // === 1. إظهار/إخفاء كلمة المرور ===
    function togglePass(inputId, el) {
        const inp = document.getElementById(inputId);
        if(!inp) return;
        const toText = inp.type === "password";
        inp.type = toText ? "text" : "password";
        toText ? el.classList.add('active') : el.classList.remove('active');
        inp.focus();
    }

    // === 2. دوال رسائل الخطأ ===
    function showError(inputId, errorId, msg) {
        const input = document.getElementById(inputId);
        const error = document.getElementById(errorId);
        input.classList.add('input-error');
        if(msg) error.textContent = msg;
        error.style.display = 'block';
    }

    function hideError(inputId, errorId) {
        const input = document.getElementById(inputId);
        const error = document.getElementById(errorId);
        input.classList.remove('input-error');
        error.style.display = 'none';
    }

    // === 3. مراقبة الحقول أثناء الكتابة ===
    const fields = [
        { id: 'identifier', err: 'identifierError' },
        { id: 'password', err: 'passwordError' }
    ];

    fields.forEach(field => {
        const el = document.getElementById(field.id);
        el.addEventListener('input', () => {
            hideError(field.id, field.err);
        });
    });

    // === 4. تسجيل الدخول الفعلي عبر جوجل ===
    async function handleGoogleLogin() {
        const btn = document.querySelector('.google-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = 'جاري الاتصال بجوجل...'; 
        btn.style.opacity = '0.7'; 
        btn.disabled = true;
        
        try {
            const result = await signInWithPopup(auth, googleProvider);
            const firebaseUser = result.user;
            
            const userDocRef = doc(db, DB_KEYS.USERS, firebaseUser.uid);
            const userDocSnap = await getDoc(userDocRef);

            if (!userDocSnap.exists()) {
                btn.innerHTML = 'جاري تهيئة الحساب...';
                const shortDisplayId = await generateUniqueDisplayId();

                const fullName = firebaseUser.displayName || 'عميل جديد';
                const nameParts = fullName.split(' ');
                const firstName = nameParts[0];
                const lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';
                const baseUsername = fullName.toLowerCase().replace(/\s+/g, '');
                const finalUsername = baseUsername + firebaseUser.uid.substring(0, 4);

                const newUser = {
                    id: firebaseUser.uid,
                    displayId: shortDisplayId,
                    name: firstName,
                    lastName: lastName,
                    username: finalUsername,
                    email: firebaseUser.email,
                    baseCurrency: 'USD',
                    base_currency: 'USD',
                    walletBalance: 0,
                    balance: 0,
                    totalSpent: 0,
                    totalDeposit: 0,
                    tierId: 1,
                    createdAt: Date.now()
                };

                if (StoreDB && typeof StoreDB.set === 'function') {
                    await StoreDB.set(DB_KEYS.USERS, firebaseUser.uid, newUser);
                } else {
                    await setDoc(userDocRef, newUser);
                }
                
                localStorage.setItem('telecard_display_currency', 'USD');
            } else {
                const userData = userDocSnap.data();
                if (userData.baseCurrency || userData.base_currency) {
                    localStorage.setItem('telecard_display_currency', userData.baseCurrency || userData.base_currency);
                }
            }
            
            localStorage.setItem('telecard_active_user_uid', firebaseUser.uid);
            const toast = document.getElementById('successToast');
            if (toast) toast.classList.add('show');
            setTimeout(() => { window.location.href = "store.html"; }, 1500);
            
        } catch (error) {
            console.error("Google Auth Error:", error);
            btn.innerHTML = originalText;
            btn.style.opacity = '1';
            btn.disabled = false;
        }
    }

    // === 5. التحقق النهائي وإرسال النموذج (تسجيل الدخول اليدوي) ===
    async function validateLogin() {
        const identifier = document.getElementById('identifier');
        const password = document.getElementById('password');
        let isValid = true;

        if (identifier.value.trim() === "") {
            showError('identifier', 'identifierError', "يرجى إدخال البريد الإلكتروني");
            isValid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identifier.value)) {
            showError('identifier', 'identifierError', "البريد الإلكتروني غير صالح");
            isValid = false;
        }

        if (password.value.trim() === "") {
            showError('password', 'passwordError', "يرجى كتابة كلمة المرور");
            isValid = false;
        }

        if (!isValid) return;

        const btn = document.getElementById('loginBtn');
        const originalText = btn.textContent;
        btn.textContent = "جاري المصادقة...";
        btn.style.opacity = "0.8";
        btn.disabled = true;

        try {
            const userCredential = await signInWithEmailAndPassword(auth, identifier.value.trim().toLowerCase(), password.value);
            const firebaseUser = userCredential.user;

            let userDoc = null;
            if(StoreDB && typeof StoreDB.getById === 'function') {
                try {
                    userDoc = await StoreDB.getById(DB_KEYS.USERS, firebaseUser.uid);
                } catch(e) { console.warn("تعذر جلب تفضيلات العميل"); }
            }

            localStorage.setItem('telecard_active_user_uid', firebaseUser.uid);
            
            if(userDoc && (userDoc.baseCurrency || userDoc.base_currency)) {
                localStorage.setItem('telecard_display_currency', userDoc.baseCurrency || userDoc.base_currency);
            }

            btn.style.background = "var(--success-green)";
            btn.style.boxShadow = "none";
            btn.textContent = "تم تسجيل الدخول بنجاح ✔";
            
            setTimeout(() => window.location.href = "store.html", 600);
            
        } catch (error) {
            console.error('Auth Error', error);
            
            if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                showError('identifier', 'identifierError', "البريد الإلكتروني أو كلمة المرور غير صحيحة");
            } else if (error.code === 'auth/too-many-requests') {
                showError('identifier', 'identifierError', "تم حظر الحساب مؤقتاً بسبب محاولات متكررة خاطئة");
            } else {
                showError('identifier', 'identifierError', "حدث خطأ غير متوقع، يرجى المحاولة لاحقاً");
            }

            btn.textContent = originalText;
            btn.style.opacity = "1";
            btn.disabled = false;
        }
    }

    window.togglePass = togglePass;
    window.handleGoogleLogin = handleGoogleLogin;
    window.validateLogin = validateLogin;

</script>

</body>
</html>
