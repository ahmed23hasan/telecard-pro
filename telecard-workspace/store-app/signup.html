<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب - تيليكارد</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* === تعريف الخطوط === */
        @font-face { font-family: 'Cairo'; src: url('fonts/Cairo-Regular.ttf') format('truetype'); font-weight: 400; }
        @font-face { font-family: 'Cairo'; src: url('fonts/Cairo-Bold.ttf') format('truetype'); font-weight: 700; }
        @font-face { font-family: 'Cairo'; src: url('fonts/Cairo-ExtraBold.ttf') format('truetype'); font-weight: 800; }
        @font-face { font-family: 'Cairo'; src: url('fonts/Cairo-Black.ttf') format('truetype'); font-weight: 900; }

        /* === المتغيرات والألوان الأساسية === */
        :root {
            --bg-store: #050910; 
            --bg-card: #111a2b;
            --gold-crystal-grad: linear-gradient(135deg, #FFD700 0%, #E3BC43 50%, #FFD700 100%);
            --gold-main: #FFD700;
            --text-btn-luxury: #3d2c00; 
            --error-red: #E53E3E;
            --warn-orange: #F6AD55;
            --success-green: #10b981;
            --text-gray: #8F9BB3;
            --border-default: #1F293A;
            --radius: 12px;
        }

        /* منع مربع اللمس الشفاف المزعج في متصفحات الهواتف */
        * { 
            box-sizing: border-box; 
            outline: none; 
            font-family: 'Cairo', sans-serif !important; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: var(--bg-store);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px; 
            padding: 35px 30px; 
            background-color: var(--bg-card);
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        /* === الرأس والعناوين === */
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #fff; font-size: 24px; font-weight: 800; margin-bottom: 4px; }
        .glow-gold { color: var(--gold-main); text-shadow: 0 0 8px rgba(251, 191, 36, 0.35); }
        .sub-text { color: var(--text-gray); font-size: 13px; font-weight: 600; }

        /* === زر غوغل === */
        .google-btn {
            width: 100%; height: 50px;
            background: #0a101d; border: 1px solid var(--border-default); border-radius: var(--radius);
            color: #fff; font-size: 14px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer; transition: .3s; margin-bottom: 20px;
        }
        .google-btn:hover { border-color: var(--text-gray); background: #111a2b; transform: translateY(-1px); }

        .divider { display: flex; align-items: center; text-align: center; margin-bottom: 20px; color: var(--text-gray); font-size: 12px; font-weight: 600; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-default); }
        .divider span { padding: 0 15px; }
        
        /* === الشبكة والحقول === */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; } 
        .full-width { grid-column: span 2; }
        
        .input-group { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            position: relative;
        }

        .input-box {
            position: relative;
            width: 100%;
            height: 52px;
            z-index: 10;
        }

        .input-field {
            width: 100%; height: 100%; padding: 0 15px;
            background: #0a101d; border: 1px solid var(--border-default);
            border-radius: var(--radius); color: #fff; font-size: 14px; font-weight: 700;
            transition: border-color 0.2s, box-shadow 0.2s; appearance: none; position: absolute; top: 0; left: 0;
        }
        
        .input-field:focus { border-color: var(--gold-main); box-shadow: 0 0 10px rgba(255, 215, 0, 0.1); }
        .input-error { border-color: var(--error-red) !important; background: rgba(229, 62, 62, 0.05) !important; box-shadow: none !important; }

        /* === التسميات العائمة الذكية === */
        .label {
            position: absolute; 
            top: 50%; right: 15px; transform: translateY(-50%);
            color: var(--text-gray); font-size: 13px; pointer-events: none; transition: .2s; font-weight: 600;
            z-index: 3; background: transparent; padding: 0 4px;
        }
        
        .input-field:focus ~ .label, 
        .input-field:not(:placeholder-shown) ~ .label {
            top: 0; right: 10px; font-size: 11px; font-weight: 700; color: var(--gold-main); background-color: var(--bg-card); z-index: 5;
        }

        input::-ms-reveal, input::-ms-clear { display: none !important; }
        .input-box.has-eye .input-field { padding-left: 45px !important; padding-right: 15px !important; }

        .error-text { 
            font-size: 11px; color: var(--error-red); font-weight: 700; 
            display: none; line-height: 1.4; margin-top: 6px; padding-right: 5px;
            animation: fadeIn 0.2s ease;
        }
        
        .warning-text { 
            font-size: 11px; color: var(--warn-orange); margin-top: 6px; padding-right: 5px;
            display: flex; align-items: center; gap: 4px; font-weight: 700; line-height: 1.4;
            position: relative; 
            z-index: 1; 
        }

        .password-warning {
            margin-top: 8px; background: rgba(246, 173, 85, 0.08); border: 1px solid rgba(246, 173, 85, 0.25);
            border-radius: 10px; padding: 10px 12px; display: none; align-items: flex-start; gap: 8px; animation: fadeIn 0.3s ease;
        }
        .password-warning svg { width: 18px; height: 18px; color: var(--warn-orange); flex-shrink: 0; margin-top: 2px; }
        .password-warning span { font-size: 12px; color: var(--text-gray); line-height: 1.6; font-weight: 600; text-align: right; }
        .password-warning span strong { color: var(--warn-orange); font-weight: 800; }

        .eye-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-gray); display: flex; align-items: center; justify-content: center; z-index: 10; transition: 0.25s ease; }
        .eye-icon:hover { color: var(--gold-main); }
        .eye-icon svg { width: 22px; height: 22px; }
        .eye-closed { display: block; } .eye-open { display: none; }
        .eye-icon.active .eye-closed { display: none; } .eye-icon.active .eye-open { display: block; }
        
        .submit-btn {
            width: 100%; height: 58px; margin-top: 30px;
            background: var(--gold-crystal-grad); color: var(--text-btn-luxury);
            border-radius: var(--radius); font-size: 17px; font-weight: 800;
            cursor: pointer; border: none; transition: transform 0.2s;
        }
        .submit-btn:active { transform: scale(0.98); }

        .footer-link { text-align: center; margin-top: 25px; font-size: 13px; color: var(--text-gray); font-weight: 700; }
        .footer-link a { color: var(--gold-main); text-decoration: none; font-weight: 800; transition: .3s; }
        .footer-link a:hover { text-shadow: 0 0 6px rgba(255,215,0,0.6); }

        .success-toast {
            position: fixed; top: 25px; left: 50%; transform: translateX(-50%) translateY(-150%);
            background: var(--gold-crystal-grad); color: var(--text-btn-luxury); padding: 12px 30px; border-radius: 50px;
            display: flex; align-items: center; justify-content: center; gap: 10px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); opacity: 0; transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
            z-index: 1000; font-weight: 800; font-size: 14px; white-space: nowrap;
        }
        .success-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .num-en { font-family: 'Inter', sans-serif !important; direction: ltr !important; text-align: left !important; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body>

    <div class="success-toast" id="successToast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>تم التسجيل بنجاح! جاري الدخول...</span>
    </div>

    <div class="container">
        <div class="header">
            <h1>إنشاء حساب في <span class="glow-gold">تيليكارد</span></h1>
            <p class="sub-text">بوابتك الأولى لعالم الخدمات الرقمية</p>
        </div>

        <button type="button" class="google-btn" onclick="handleGoogleLogin()">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            التسجيل السريع بواسطة Google
        </button>

        <div class="divider"><span>أو إدخال البيانات يدوياً</span></div>

        <form autocomplete="off" id="regForm">
            <div class="form-grid">
                
                <div class="input-group">
                    <div class="input-box">
                        <input type="text" class="input-field" placeholder=" " id="fname" maxlength="25">
                        <label class="label">الاسم الأول</label>
                    </div>
                    <div class="error-text" id="fnameError"></div>
                </div>

                <div class="input-group">
                    <div class="input-box">
                        <input type="text" class="input-field" placeholder=" " id="lname" maxlength="25">
                        <label class="label">الاسم الأخير</label>
                    </div>
                    <div class="error-text" id="lnameError"></div>
                </div>

                <div class="input-group full-width">
                    <div class="input-box">
                        <input type="email" class="input-field num-en" placeholder=" " id="email" maxlength="50">
                        <label class="label">البريد الإلكتروني</label>
                    </div>
                    <div class="error-text" id="emailError"></div>
                </div>

                <div class="input-group full-width">
                    <div class="input-box has-eye">
                        <input type="password" class="input-field num-en" placeholder=" " id="password" maxlength="30">
                        <label class="label">كلمة المرور</label>
                        <div class="eye-icon" onclick="togglePass('password', this)">
                            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2.5-4 5.5-6 9-6 3.5 0 6.5 2 9 6-2.5 4-5.5 6-9 6-3.5 0-6.5-2-9-6z" /><path d="M5 5l14 14" stroke-width="1.6" /></svg>
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3.2" /></svg>
                        </div>
                    </div>
                    <div class="password-warning" id="passWarning">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <span id="passWarningText"><strong>تنبيه الأمان:</strong> يرجى إدخال كلمة مرور قوية.</span>
                    </div>
                </div>

                <div class="input-group full-width">
                    <div class="input-box has-eye">
                        <input type="password" class="input-field num-en" placeholder=" " id="confirm" maxlength="30">
                        <label class="label">تأكيد كلمة المرور</label>
                        <div class="eye-icon" onclick="togglePass('confirm', this)">
                            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2.5-4 5.5-6 9-6 3.5 0 6.5 2 9 6-2.5 4-5.5 6-9 6-3.5 0-6.5-2-9-6z" /><path d="M5 5l14 14" stroke-width="1.6" /></svg>
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3.2" /></svg>
                        </div>
                    </div>
                    <div class="error-text" id="confirmError"></div>
                </div>

            </div>

            <button type="button" class="submit-btn" id="submitBtn" onclick="validateAndRegister()">إنشاء حساب جديد</button>

            <div class="footer-link">
                لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
            </div>

        </form>
    </div>
<script type="module">
    // 🚀 استيراد أدوات فايربيز وقاعدة البيانات من المحول المركزي
    import { auth, db } from './core/firebaseAdapter.js';
    import { createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, query, where, getDocs, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    import { DB_KEYS } from './config.js';
    import { StoreDB } from './dataManager.js';

    const googleProvider = new GoogleAuthProvider();

    // =================================================================
    // 🌟 دالة جلب عملة العرض الافتراضية للمتجر ديناميكياً لتأمين الحساب
    // =================================================================
    async function getAdminDefaultCurrency() {
        try {
            const settingsSnap = await getDocs(collection(db, DB_KEYS.SETTINGS));
            if (!settingsSnap.empty) {
                const settingsData = settingsSnap.docs[0].data();
                const defaultCurr = settingsData.defaultCurrency || settingsData.currency || 'USD';
                return String(defaultCurr).toUpperCase();
            }
        } catch (error) {
            console.warn("⚠️ تعذر جلب العملة الافتراضية، سيتم استخدام USD كاحتياطي.");
        }
        return 'USD';
    }

    async function generateUniqueDisplayId() {
        let isUnique = false;
        let newId = 0;
        let attempts = 0;
        const maxAttempts = 5;

        while (!isUnique && attempts < maxAttempts) {
            attempts++;
            newId = Math.floor(1000000 + Math.random() * 9000000);

            try {
                const q = query(collection(db, DB_KEYS.USERS), where("displayId", "==", newId));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    isUnique = true; 
                }
            } catch (error) {
                console.warn("⚠️ فشل فحص الـ ID، سيتم استخدام خطة الطوارئ.");
                break;
            }
        }

        if (!isUnique) {
            newId = Number(String(Date.now()).slice(-7));
        }

        return newId;
    }

    function togglePass(inputId, el) {
        const inp = document.getElementById(inputId);
        const toText = inp.type === "password";
        inp.type = toText ? "text" : "password";
        toText ? el.classList.add('active') : el.classList.remove('active');
        inp.focus(); 
    }

    const passInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    const passWarning = document.getElementById('passWarning');
    const passWarningText = document.getElementById('passWarningText');
    let isPassStrong = false;

    function checkPasswordStrength() {
        const val = passInput.value;
        if (val.length === 0) {
            passWarning.style.display = 'none';
            passInput.classList.remove('input-error');
            isPassStrong = false;
            return;
        }

        let missing = [];
        const remaining = 8 - val.length;
        if (remaining > 0) {
            if (remaining === 1) missing.push("حرف واحد إضافي");
            else if (remaining === 2) missing.push("حرفين إضافيين");
            else if (remaining > 2 && remaining < 11) missing.push(`${remaining} أحرف إضافية`);
            else missing.push(`${remaining} حرفاً إضافياً`);
        }

        if (!/[A-Z]/.test(val)) missing.push("حرف كبير (A-Z)");
        if (!/[a-z]/.test(val)) missing.push("حرف صغير (a-z)");
        if (!/[0-9]/.test(val)) missing.push("رقم (0-9)");
        if (!/[^a-zA-Z0-9]/.test(val)) missing.push("رمز خاص (@#$%)");

        isPassStrong = missing.length === 0;

        if (!isPassStrong) {
            passWarning.style.display = 'flex';
            passInput.classList.add('input-error');
            passWarningText.innerHTML = `<strong>ينقص كلمة المرور:</strong> ${missing.join('، ')}`;
        } else {
            passWarning.style.display = 'none';
            passInput.classList.remove('input-error');
        }
    }

    passInput.addEventListener('input', checkPasswordStrength);
    passInput.addEventListener('blur', () => {
        if (passInput.value.trim() === '') { passWarning.style.display = 'none'; passInput.classList.remove('input-error'); } 
        else { checkPasswordStrength(); }
    });

    confirmInput.addEventListener('input', function() { if(this.value === passInput.value) hideError('confirm', 'confirmError'); });

    const latinRegex = /^[\p{Script=Latin}\s'.-]+$/u;

    function enforceValidation(elId, errId, type) {
        const el = document.getElementById(elId);
        el.addEventListener('input', function() {
            const val = this.value;
            if (val.trim() === '') hideError(elId, errId);
            else {
                if (type === 'name' && !latinRegex.test(val)) showError(elId, errId, 'يُرجى استخدام الأحرف اللاتينية فقط');
                else if (type === 'email' && !/^[\x20-\x7E]+$/.test(val)) showError(elId, errId, 'يُرجى إدخال بريد إلكتروني صالح');
                else hideError(elId, errId); 
            }
        });
        el.addEventListener('blur', function() { if (this.value.trim() === '') showError(elId, errId, 'هذا الحقل مطلوب'); });
    }

    enforceValidation('fname', 'fnameError', 'name');
    enforceValidation('lname', 'lnameError', 'name');
    enforceValidation('email', 'emailError', 'email');

    function showError(inputId, errorId, msg) {
        document.getElementById(inputId).classList.add('input-error');
        const err = document.getElementById(errorId);
        if(msg) err.textContent = msg;
        err.style.display = 'block';
    }
    function hideError(inputId, errorId) {
        const input = document.getElementById(inputId);
        if (input) input.classList.remove('input-error');
        const err = document.getElementById(errorId);
        if (err) err.style.display = 'none';
    }

// =================================================================
// 🌐 دالة التسجيل عبر جوجل (النسخة الديناميكية المعززة مع سحب صورة غوغل)
// =================================================================
async function handleGoogleLogin() {
    const btn = document.querySelector('.google-btn');
    const originalText = btn.innerHTML;
    btn.innerHTML = 'جاري الاتصال بجوجل...';
    btn.style.opacity = '0.7';
    btn.disabled = true;
    
    try {
        const result = await signInWithPopup(auth, googleProvider);
        const firebaseUser = result.user;
        
        const userDocRef = doc(db, DB_KEYS.USERS, firebaseUser.uid);
        const userDocSnap = await getDoc(userDocRef);
        
        let activeUserObj = null;
        
        if (!userDocSnap.exists()) {
            btn.innerHTML = 'جاري تهيئة الحساب...';
            
            // جلب عملة العرض ديناميكياً لإنشاء المحفظة
            const targetCurrency = await getAdminDefaultCurrency();
            const shortDisplayId = await generateUniqueDisplayId();
            
            const fullName = firebaseUser.displayName || 'عميل جديد';
            const nameParts = fullName.split(' ');
            const firstName = nameParts[0];
            const lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';
            const baseUsername = fullName.toLowerCase().replace(/\s+/g, '');
            const finalUsername = baseUsername + firebaseUser.uid.substring(0, 4);
            
            // 🌟 [الإصلاح الجذري]: سحب صورة بروفايل حساب غوغل الأصلي للعميل (إذا وُجدت)
            let googleAvatar = null;
            if (firebaseUser.photoURL) {
                // تكبير جودة الصورة من غوغل (إزالة قياس =s96-c الافتراضي الصغير)
                googleAvatar = firebaseUser.photoURL.replace('=s96-c', '=s400-c');
            }
            
            activeUserObj = {
                id: firebaseUser.uid,
                displayId: shortDisplayId,
                name: firstName,
                lastName: lastName,
                username: finalUsername,
                email: firebaseUser.email,
                img: googleAvatar, // 🌟 حفظ الصورة في قاعدة البيانات
                baseCurrency: targetCurrency,
                base_currency: targetCurrency,
                phone: null,
                country: null,
                walletBalance: 0,
                balance: 0,
                totalSpent: 0,
                totalDeposit: 0,
                tierId: "",
                createdAt: Date.now()
            };
            
            if (StoreDB && typeof StoreDB.set === 'function') {
                await StoreDB.set(DB_KEYS.USERS, firebaseUser.uid, activeUserObj);
            } else {
                await setDoc(userDocRef, activeUserObj);
            }
        } else {
            activeUserObj = userDocSnap.data();
            
            // 🌟 [ترقية إضافية]: إذا كان العميل القديم لا يمتلك صورة، نحدث حسابه بصورة غوغل الآن!
            if (!activeUserObj.img && firebaseUser.photoURL) {
                const freshAvatar = firebaseUser.photoURL.replace('=s96-c', '=s400-c');
                activeUserObj.img = freshAvatar;
                if (StoreDB && typeof StoreDB.set === 'function') {
                    await StoreDB.set(DB_KEYS.USERS, firebaseUser.uid, { img: freshAvatar });
                } else {
                    await setDoc(userDocRef, { img: freshAvatar }, { merge: true });
                }
            }
        }
        
        localStorage.setItem('telecard_active_user_uid', firebaseUser.uid);
        localStorage.setItem('telecard_active_user', JSON.stringify(activeUserObj));
        localStorage.setItem('telecard_display_currency', activeUserObj.baseCurrency || activeUserObj.base_currency || 'USD');
        
        // 🌟 كاش سريع جداً لتظهر الصورة فور دخول المتجر بلا تقطيع
        if (activeUserObj.img) {
            localStorage.setItem('telecard_user_image_' + firebaseUser.uid, activeUserObj.img);
        }
        
        const toast = document.getElementById('successToast');
        if (toast) toast.classList.add('show');
        setTimeout(() => { window.location.href = "store.html"; }, 1500);
        
    } catch (error) {
        console.error("Google Auth Error:", error);
        btn.innerHTML = originalText;
        btn.style.opacity = '1';
        btn.disabled = false;
    }
}
    // =================================================================
    // ✍️ دالة التسجيل اليدوي (المسرعة والمعززة بكاش المزامنة وعملات الإدارة)
    // =================================================================
    async function validateAndRegister() {
        const fname = document.getElementById('fname');
        const lname = document.getElementById('lname');
        const email = document.getElementById('email');
        const pass = document.getElementById('password');
        const confirm = document.getElementById('confirm');
        let isValid = true;

        if(!fname.value.trim()) { showError('fname', 'fnameError', 'هذا الحقل مطلوب'); isValid = false; }
        else if(!latinRegex.test(fname.value)) { showError('fname', 'fnameError', 'يُرجى استخدام الأحرف اللاتينية فقط'); isValid = false; }
        
        if(!lname.value.trim()) { showError('lname', 'lnameError', 'هذا الحقل مطلوب'); isValid = false; }
        else if(!latinRegex.test(lname.value)) { showError('lname', 'lnameError', 'يُرجى استخدام الأحرف اللاتينية فقط'); isValid = false; }
        
        if(!email.value.trim()) { showError('email', 'emailError', 'هذا الحقل مطلوب'); isValid = false; }
        else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) { showError('email', 'emailError', 'البريد الإلكتروني غير صالح'); isValid = false; }
        
        if(pass.value.trim() === '') {
            passInput.classList.add('input-error');
            passWarningText.innerHTML = `<strong>تنبيه الأمان:</strong> حقل كلمة المرور مطلوب.`;
            document.getElementById('passWarning').style.display = 'flex';
            isValid = false;
        } else if(!isPassStrong) { checkPasswordStrength(); isValid = false; }
        
        if(pass.value !== confirm.value || confirm.value.trim() === '') { showError('confirm', 'confirmError', 'كلمات المرور غير متطابقة'); isValid = false; }

        if(!isValid) return;

        const btn = document.getElementById('submitBtn');
        const originalBtnText = btn.textContent;
        btn.textContent = "جاري إنشاء الحساب والمصادقة...";
        btn.style.opacity = "0.8";
        btn.style.pointerEvents = "none";

        try {
            const rawEmail = email.value.trim().toLowerCase();
            const userCredential = await createUserWithEmailAndPassword(auth, rawEmail, pass.value);
            const firebaseUser = userCredential.user;

            let baseUsername = `${fname.value.trim()}.${lname.value.trim()}`.toLowerCase().replace(/\s+/g, '');
            let finalUsername = baseUsername + firebaseUser.uid.substring(0, 4);

            // جلب عملة العرض الافتراضية المحددة من الأدمن ديناميكياً [1]
            const targetCurrency = await getAdminDefaultCurrency();
            const shortDisplayId = await generateUniqueDisplayId();

            const newUser = {
                id: firebaseUser.uid,
                displayId: shortDisplayId,
                name: fname.value.trim(),
                lastName: lname.value.trim(),
                username: finalUsername, 
                email: firebaseUser.email,
                baseCurrency: targetCurrency, // 🌟 ديناميكي [1]
                base_currency: targetCurrency, // 🌟 ديناميكي [1]
                phone: null,
                country: null,
                walletBalance: 0, 
                balance: 0, 
                totalSpent: 0,
                totalDeposit: 0,
                tierId: "", // رتبة فارغة افتراضية
                createdAt: Date.now()
            };

            if(StoreDB && typeof StoreDB.set === 'function') {
                await StoreDB.set(DB_KEYS.USERS, firebaseUser.uid, newUser);
            } else {
                const userDocRef = doc(db, DB_KEYS.USERS, firebaseUser.uid);
                await setDoc(userDocRef, newUser);
            }

            localStorage.setItem('telecard_active_user_uid', firebaseUser.uid);
            
            // زرع كاش الإنعاش الفوري للرصيد والعملة لتجنب الومضات البصرية
            localStorage.setItem('telecard_active_user', JSON.stringify(newUser));
            localStorage.setItem('telecard_display_currency', targetCurrency);

            document.getElementById('successToast').classList.add('show');
            setTimeout(() => { window.location.href = "store.html"; }, 1500);

        } catch(error) {
            console.error("Auth Error:", error);
            if (error.code === 'auth/email-already-in-use') { 
                // 🌟 [التوجيه الذكي والفاخر]: تخزين الإيميل المسجل وتوجيه العميل لصفحة الدخول [1]
                showError('email', 'emailError', 'البريد مسجل مسبقاً! جاري توجيهك لصفحة تسجيل الدخول...');
                try {
                    sessionStorage.setItem('prefilled_email', email.value.trim().toLowerCase());
                } catch(e) {}
                
                // توجيه تلقائي جذاب بعد 2 ثانية
                setTimeout(() => { window.location.href = "login.html"; }, 1800);
            } 
            else if (error.code === 'auth/network-request-failed') { showError('email', 'emailError', 'خطأ في الاتصال بالإنترنت'); } 
            else { showError('email', 'emailError', 'حدث خطأ أثناء التسجيل، يرجى المحاولة لاحقاً'); }
            
            btn.textContent = originalBtnText;
            btn.style.opacity = "1";
            btn.style.pointerEvents = "auto";
        }
    }

    window.togglePass = togglePass;
    window.handleGoogleLogin = handleGoogleLogin;
    window.validateAndRegister = validateAndRegister;

</script>
