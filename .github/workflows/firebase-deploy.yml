name: Deploy Full Telecard System (Micro-Batched)

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Functions Dependencies
        working-directory: ./functions
        run: npm install

      # ==========================================
      # 1️⃣ الاستضافة وقواعد الحماية
      # ==========================================
      - name: Deploy Hosting & Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,firestore --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELECARD_1 }}
          PROJECT_ID: telecard-1

      - run: sleep 10

      # ==========================================
      # 2️⃣ دوال المستخدمين الأساسية (الجزء الأول) - 4 دوال
      # ==========================================
      - name: Deploy Batch 1 (Core A)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only "functions:onUserAuthCreated,functions:createOrder,functions:submitBalanceRequest,functions:completeUserIdentity" --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELECARD_1 }}
          PROJECT_ID: telecard-1

      - run: sleep 60

      # ==========================================
      # 3️⃣ دوال المستخدمين الأساسية (الجزء الثاني) - 4 دوال
      # ==========================================
      - name: Deploy Batch 2 (Core B)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only "functions:getServerTime,functions:calculateStoreStatsCloud,functions:adminToggleUserBan,functions:adminProcessOrder" --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELECARD_1 }}
          PROJECT_ID: telecard-1

      - run: sleep 60

      # ==========================================
      # 4️⃣ دوال الإدارة والمالية (الجزء الأول) - 4 دوال
      # ==========================================
      - name: Deploy Batch 3 (Admin A)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only "functions:adminProcessDeposit,functions:adminAdjustBalance,functions:adminAuditUserWallet,functions:grantAdminRole" --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELECARD_1 }}
          PROJECT_ID: telecard-1

      - run: sleep 60

      # ==========================================
      # 5️⃣ دوال الإدارة والمالية (الجزء الثاني) - 4 دوال
      # ==========================================
      - name: Deploy Batch 4 (Admin B)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only "functions:adminDeleteUserData,functions:adminForceSyncCatalog,functions:adminSaveVaultCodes,functions:adminDeleteVaultPool" --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELECARD_1 }}
          PROJECT_ID: telecard-1

      - run: sleep 60

      # ==========================================
      # 6️⃣ المشغلات (Triggers) - 4 دوال
      # ==========================================
      - name: Deploy Batch 5 (Triggers A)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only "functions:onSettingsUpdate,functions:onOfferUpdate,functions:secureProductSync,functions:onTierUpdate" --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELECARD_1 }}
          PROJECT_ID: telecard-1

      - run: sleep 60

      # ==========================================
      # 7️⃣ الإشعارات والمهام المجدولة - 4 دوال
      # ==========================================
      - name: Deploy Batch 6 (Triggers B & Cron)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only "functions:autoNotifyOrderStatus,functions:autoNotifyDepositStatus,functions:autoUpdateGlobalStats,functions:cleanupOrphanedKycDocs" --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELECARD_1 }}
          PROJECT_ID: telecard-1

      - run: sleep 60

      # ==========================================
      # 8️⃣ دوال الموردين الخارجية (الربط الخارجي) - 6 دوال
      # ==========================================
      - name: Deploy Batch 7 (Suppliers)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only "functions:orderStatusWebhook,functions:cronRetryWebhooks,functions:externalCreateOrder,functions:syncSupplierData,functions:scheduledSupplierSync,functions:secureSaveSupplier" --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELECARD_1 }}
          PROJECT_ID: telecard-1
