name: Deploy Telecard System (Architecture Aligned)

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Functions Dependencies
        working-directory: ./functions
        run: npm install

      - name: Parse Commit Message
        id: parse_msg
        run: |
          MSG=$(cat << 'EOF'
          ${{ github.event.head_commit.message }}
          EOF
          )
          TARGET=$(echo "$MSG" | grep -oP 'deploy:\K[a-zA-Z0-9_,]+' | head -n 1)
          
          if [ ! -z "$TARGET" ]; then
            case $TARGET in
              "finance")
                DEPLOY_TARGET="functions:createOrder,functions:submitBalanceRequest,functions:adminProcessOrder,functions:adminAdjustBalance"
                ;;
              "suppliers")
                DEPLOY_TARGET="functions:syncSupplierData,functions:scheduledSupplierSync,functions:externalCreateOrder"
                ;;
              "users")
                DEPLOY_TARGET="functions:onUserAuthCreated,functions:completeUserIdentity,functions:adminToggleUserBan"
                ;;
              "system")
                DEPLOY_TARGET="functions:getServerTime,functions:autoUpdateGlobalStats,functions:cleanupOrphanedKycDocs"
                ;;
              *)
                DEPLOY_TARGET="functions:$TARGET"
                ;;
            esac
            echo "DEPLOY_TARGET=$DEPLOY_TARGET" >> $GITHUB_ENV
            echo "RUN_DEPLOY=true" >> $GITHUB_ENV
          else
            echo "RUN_DEPLOY=false" >> $GITHUB_ENV
          fi

      - name: Deploy Hosting & Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,firestore,storage --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELECARD_1 }}
          PROJECT_ID: telecard-1

      - name: Deploy Selected Group
        if: env.RUN_DEPLOY == 'true'
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only ${{ env.DEPLOY_TARGET }} --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELECARD_1 }}
          PROJECT_ID: telecard-1
