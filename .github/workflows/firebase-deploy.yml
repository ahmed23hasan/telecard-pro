name: Deploy Full Telecard System (Hosting, Functions, Rules)

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # تم التحديث إلى 20 ليتوافق مع بيئة فايربيز الجديدة

      - name: Install Functions Dependencies
        working-directory: ./functions
        run: npm install

      - name: Deploy to Firebase (Hosting, Functions, Firestore Rules)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --force # 🌟 تمت إضافة أمر الإجبار هنا لحل مشكلة سياسة التنظيف
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELECARD_1 }}
          PROJECT_ID: telecard-1
