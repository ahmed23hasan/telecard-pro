name: Deploy Telecard System (Smart Commit)

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Functions Dependencies
        working-directory: ./functions
        run: npm install

      # ==========================================
      # 🔍 تحليل رسالة الكوميت القادمة من Spck Editor
      # ==========================================
      - name: Parse Commit Message
        id: parse_msg
        run: |
          MSG=$(cat << 'EOF'
          ${{ github.event.head_commit.message }}
          EOF
          )
          echo "Commit message: $MSG"
          
          # استخراج الكلمة التي تأتي بعد كلمة deploy:
          TARGET=$(echo "$MSG" | grep -oP 'deploy:\K[a-zA-Z0-9_,]+' | head -n 1)
          
          if [ ! -z "$TARGET" ]; then
            echo "🎯 Found function(s) to deploy: $TARGET"
            echo "DEPLOY_TARGET=functions:$TARGET" >> $GITHUB_ENV
            echo "RUN_DEPLOY=true" >> $GITHUB_ENV
          else
            echo "⏸️ No 'deploy:' tag found. Will only deploy hosting/rules."
            echo "RUN_DEPLOY=false" >> $GITHUB_ENV
          fi

      # ==========================================
      # 1️⃣ الرفع التلقائي (الاستضافة وقواعد البيانات فقط)
      # ==========================================
      - name: Deploy Hosting & Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,firestore --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELECARD_1 }}
          PROJECT_ID: telecard-1

      # ==========================================
      # 2️⃣ الرفع الانتقائي (الدالة التي كتبتها أنت فقط)
      # ==========================================
      - name: Deploy Specific Function
        if: env.RUN_DEPLOY == 'true'
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only ${{ env.DEPLOY_TARGET }} --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TELECARD_1 }}
          PROJECT_ID: telecard-1
